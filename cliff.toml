# git-cliff writes CHANGELOG.md from the Conventional Commits between two tags.
# `scripts/release.sh` runs it on a release; see the release section of README.md.
# git-cliff has no Forgejo remote, so the template holds the URL of the repository.

[changelog]
header = """
# Changelog

Every notable change of fastest-scan. The entries come from the commit messages.\n
"""
body = """
{% set repository = "https://github.com/jaysonsantos/fastest-scan" %}\
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}]({{ repository }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | upper_first }}{% if commit.breaking %} (**breaking**){% endif %} \
([{{ commit.id | truncate(length=7, end="") }}]({{ repository }}/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = true
# A commit without a Conventional Commits type stays out of the changelog.
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^Merge", skip = true },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^build", group = "Build" },
  { message = "^ci", group = "Continuous integration" },
  { message = "^test", group = "Tests" },
  { message = ".*", skip = true },
]

[bump]
# The version is below 1.0.0: a breaking change bumps the minor number.
breaking_always_bump_major = false
features_always_bump_minor = true
# The first release, when the repository has no tag.
initial_tag = "v0.1.0"
