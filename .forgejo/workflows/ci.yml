name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The jobs run on the host of the runner, not in a container: `cachyos-nix` is a host
# label, and .github/actionlint.yaml lists it. A job assumes three tools of the host
# only: `nix` for the dev shell, and `git` and `node` for the checkout action. All
# other tools come from flake.nix. So CI and a developer use the same versions, and
# the nix store of the host keeps the tools between runs.
#
# A host job runs with the rights of the user of the runner. Read the code of a pull
# request from another person before you let its jobs run.
env:
  NIX_CONFIG: experimental-features = nix-command flakes

# CI has no benchmark video. It lints, runs the unit tests and the test of the JNI layer,
# and builds the release binary.
jobs:
  lint:
    runs-on: cachyos-nix
    steps:
      - uses: actions/checkout@v7
      - name: Lint
        run: nix develop --command scripts/lint.sh

  test:
    runs-on: cachyos-nix
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: nix develop --command scripts/test.sh

  # The JNI layer of the Android app on the Java machine of the runner. The Android
  # app itself has no job: its build needs the Android SDK, which has a licence.
  jni:
    runs-on: cachyos-nix
    steps:
      - uses: actions/checkout@v7
      - name: Test the JNI layer
        run: nix develop --command scripts/test-jni.sh

  build:
    runs-on: cachyos-nix
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: nix develop --command scripts/build.sh

  check:
    if: always()
    needs: [lint, test, jni, build]
    runs-on: cachyos-nix
    steps:
      - name: Check the result of every job
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          echo "$RESULTS" | grep -q '"result": *"\(failure\|cancelled\|skipped\)"' && exit 1 || exit 0
